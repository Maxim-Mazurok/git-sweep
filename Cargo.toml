[package]
name = "git-sweep"
version = "0.1.0"
edition = "2024"
description = "Idle-aware Git repository maintenance for macOS"
license = "MIT"
repository = "https://github.com/Maxim-Mazurok/git-sweep"
rust-version = "1.85"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
fs2 = "0.4"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.3"
toml = "0.8"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
